name: Build

on:
  pull_request:
  push:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
      
      - name: Cache xmake dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-v2-${{ hashFiles('xmake.lua', 'xmake/repository/**') }}
          restore-keys: |
            xmake-v2-

      - name: Update xmake repository
        run: xmake repo -u

      - name: Patch LeviLamina header issue
        shell: pwsh
        run: |
          Get-ChildItem -Path "$env:LOCALAPPDATA\.xmake", ".\.xmake" -Recurse -Filter "xmake.lua" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*packages*l*levilamina*xmake.lua" } | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -notmatch "CommandRegistry.h") {
              $old = 'import("package.tools.xmake").install(package, {"--target_type=client"})'
              $replacement = @'
        local cmd_h = "src/mc/server/commands/MinecraftCommands.h"
        if os.isfile(cmd_h) then
            io.replace(cmd_h, "class CommandRegistry;", "#include \"mc/server/commands/CommandRegistry.h\"\n#include \"mc/server/commands/CommandOutputSender.h\"\n#include \"mc/server/commands/Command.h\"\n#include \"mc/server/commands/DeferredCommandBase.h\"\nclass CommandRegistry;", {plain = true})
        end
        import("package.tools.xmake").install(package, {"--target_type=client"})
'@
              $patched = $content.Replace($old, $replacement)
              Set-Content -Path $_.FullName -Value $patched -Encoding utf8
              Write-Host "Patched $($_.FullName)"
            }
          }

      - name: Configure xmake (Client Only)
        # 去除了 --target_type 参数，因为 xmake.lua 已经硬编码为纯客户端模式
        run: xmake f -a x64 -m release -p windows -y

      - name: Build
        run: xmake

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: bin/
