name: Build

on:
  pull_request:
  push:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
      
      - name: Cache xmake dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-v3-${{ hashFiles('xmake.lua', 'xmake/repository/**') }}
          restore-keys: |
            xmake-v3-

      - name: Register local repository
        run: |
          xmake repo -a local-repo xmake/repository
          xmake repo -u

      - name: Configure xmake (Client Only)
        run: xmake f -a x64 -m release -p windows -vD -y

      - name: Dump install logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path "$env:LOCALAPPDATA\.xmake" -Recurse -Filter "install.txt" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "================== $($_.FullName) =================="
            Get-Content -Path $_.FullName
          }

      - name: Build
        run: xmake -vD

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: bin/
